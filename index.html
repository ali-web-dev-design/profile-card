<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="profile-card">
        <img src="ali-malik.png" alt="Ali web developer" class="profile-image">
        <h2 class="profile-title">Ali Malik</h2>
        <h4 class="profile-profession">Web Developer</h4>
        <p class="Location">Kot Abdul Malik, Lahore,Pakistan</p>
        <div class="profile-buttons">
            <button class="btn follow-btn">Follow</button>
            <button class="btn message-btn">Message</button>
        </div>
    </div>

</body>

</html>
